<!doctype html>
<html lang="en" class="light" data-theme="skeleton">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="Studiq — AI Study Companion" />
    <meta property="og:description" content="Transform your notes into AI-powered quizzes, flashcards, and study plans. Built for WAEC & JAMB students." />
    <meta property="og:image" content="https://studiq-gze9.onrender.com/logo/studiq-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Studiq — Study Smarter with AI" />
    <meta property="og:url" content="https://studiq-gze9.onrender.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studiq" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Studiq — AI Study Companion" />
    <meta name="twitter:description" content="Transform your notes into AI-powered quizzes, flashcards, and study plans." />
    <meta name="twitter:image" content="https://studiq-gze9.onrender.com/logo/studiq-logo.png" />
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
